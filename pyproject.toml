[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-olist"
version = "0.1.0"
description = "Agente de IA para atendimento, conciliação, previsão de atraso e relatórios sobre o dataset público da Olist"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pydantic>=2.0",
    "gradio>=4.0",
    "kagglehub>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agente-olist = "agente_olist.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
